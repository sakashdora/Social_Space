name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Scan for credentials
        run: npm run check:secrets

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Lint frontend
        run: npm run lint

      - name: Unit and API tests (SQLite stand-in for D1, no network)
        run: npm test

      - name: Build frontend for Cloudflare Pages
        run: npm run build:web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Scan the browser bundle for credentials
        run: npm run check:secrets -- --dist

      - name: Validate the Worker bundle compiles
        working-directory: backend
        run: |
          npm run generate
          npx wrangler deploy --dry-run --outdir ../.wrangler-ci
